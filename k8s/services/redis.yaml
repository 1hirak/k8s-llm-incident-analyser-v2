# Redis — job state + pub/sub for the orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: analyser
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: analyser
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
