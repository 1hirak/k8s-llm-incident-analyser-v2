# llm-svc — LLM providers (API keys via llm-secrets Secret + runtime config)
# ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-config-data
  namespace: analyser
  labels:
    app.kubernetes.io/name: llm-svc
    app.kubernetes.io/component: platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-config
  namespace: analyser
  labels:
    app.kubernetes.io/name: llm-svc
    app.kubernetes.io/component: platform
data:
  LLM_PROVIDER: "mock"
  LLM_MAX_TOKENS: "4096"
  LLM_RETRY_MAX_TOKENS: "8192"
  OPENROUTER_REASONING_EFFORT: ""
  OPENROUTER_PROMPT_CACHE: "true"
  OPENROUTER_RESPONSE_CACHE: "false"
  OPENROUTER_RETRY_DELAY_SECONDS: "2"
  REDIS_URL: "redis://redis:6379/0"
  LLM_ANALYSIS_CACHE_ENABLED: "true"
  LLM_ANALYSIS_CACHE_TTL: "900"
  LLM_CONFIG_PATH: "/data/llm-config.json"
# Create the secret with real keys before switching providers:
#   kubectl create secret generic llm-secrets -n analyser \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=DEEPSEEK_API_KEY=sk-... \
#     --from-literal=OPENROUTER_API_KEY=sk-or-...
# Alternatively, configure keys at runtime via the dashboard Settings page
# (they are written to the mounted PVC at /data/llm-config.json).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: analyser
  labels:
    app.kubernetes.io/name: llm-svc
    app.kubernetes.io/component: platform
spec:
  replicas: 1  # single writer — runtime config is file-based
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm
  template:
    metadata:
      labels:
        app: llm
    spec:
      containers:
        - name: llm
          image: k8s-llm-llm-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: llm-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          volumeMounts:
            - name: config-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: 300m
      volumes:
        - name: config-data
          persistentVolumeClaim:
            claimName: llm-config-data
---
apiVersion: v1
kind: Service
metadata:
  name: llm
  namespace: analyser
spec:
  selector:
    app: llm
  ports:
    - port: 8004
      targetPort: 8004
