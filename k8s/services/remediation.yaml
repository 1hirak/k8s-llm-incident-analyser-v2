# remediation-svc — typed changes with dry-run and explicit approval
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation
  namespace: analyser
  labels:
    app.kubernetes.io/name: remediation-svc
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation
  template:
    metadata:
      labels:
        app: remediation
    spec:
      serviceAccountName: remediation-sa
      containers:
        - name: remediation
          image: k8s-llm-remediation-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8008
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: REMEDIATION_ENABLED
              value: "false"
            - name: REMEDIATION_MODE
              value: "approval"
            - name: REMEDIATION_NAMESPACES
              value: "demo"
            - name: KUBERNETES_AUTH_MODE
              value: "in-cluster"
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: 300m
---
apiVersion: v1
kind: Service
metadata:
  name: remediation
  namespace: analyser
spec:
  selector:
    app: remediation
  ports:
    - port: 8008
      targetPort: 8008
