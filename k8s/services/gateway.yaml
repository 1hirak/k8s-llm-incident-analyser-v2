# gateway-svc — public API entry point (NodePort for external access)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: analyser
  labels:
    app.kubernetes.io/name: gateway-svc
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: k8s-llm-gateway-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: ORCHESTRATOR_URL
              value: "http://orchestrator:8001"
            - name: REPORTS_URL
              value: "http://reports:8005"
            - name: SCENARIO_URL
              value: "http://scenario:8006"
            - name: LLM_URL
              value: "http://llm:8004"
            - name: REMEDIATION_URL
              value: "http://remediation:8008"
            - name: GATEWAY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth
                  key: API_TOKEN
                  optional: true
            - name: CORS_ALLOW_ORIGINS
              value: "http://localhost:3000"
            - name: RATE_LIMIT_PER_MINUTE
              value: "60"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              memory: 96Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: analyser
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
