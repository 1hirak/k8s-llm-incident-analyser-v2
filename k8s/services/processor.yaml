# processor-svc — preprocess + redact (pure CPU, no cluster access)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  namespace: analyser
  labels:
    app.kubernetes.io/name: processor-svc
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      containers:
        - name: processor
          image: k8s-llm-processor-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: MAX_LOG_LINES
              value: "100"
            - name: CONTEXT_WINDOW
              value: "3"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 192Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: processor
  namespace: analyser
spec:
  selector:
    app: processor
  ports:
    - port: 8003
      targetPort: 8003
