# watcher-svc — continuous read-only unhealthy pod detection
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: watcher
  namespace: analyser
  labels:
    app.kubernetes.io/name: watcher-svc
    app.kubernetes.io/component: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: watcher
  template:
    metadata:
      labels:
        app: watcher
    spec:
      serviceAccountName: collector-sa
      containers:
        - name: watcher
          image: k8s-llm-watcher-svc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8007
          env:
            - name: ORCHESTRATOR_URL
              value: "http://orchestrator:8001"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: WATCHER_ENABLED
              value: "true"
            - name: WATCH_NAMESPACES
              value: "demo"
            - name: WATCH_INTERVAL_SECONDS
              value: "30"
            - name: WATCH_COOLDOWN_SECONDS
              value: "900"
            - name: WATCH_RESTART_THRESHOLD
              value: "3"
            - name: KUBERNETES_AUTH_MODE
              value: "in-cluster"
          readinessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: 96Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: watcher
  namespace: analyser
spec:
  selector:
    app: watcher
  ports:
    - port: 8007
      targetPort: 8007
