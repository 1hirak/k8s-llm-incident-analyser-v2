# ============================================================================
# Infrastructure Contract — Docker Compose Dev Override
# ============================================================================
# This file is a docker-compose override for local development.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Changes from production docker-compose.yml:
#   - Source code is bind-mounted into each container (no rebuild needed)
#   - Uvicorn runs with --reload (auto-restart on file change)
#   - Next.js runs in dev mode (hot module replacement)
#   - Healthcheck intervals shortened for faster feedback
#
# Paths are relative to this file's location (contracts/infra/).
# The repo-root docker-compose.dev.yml mirrors this file with paths
# relative to the repo root.
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Frontend: Next.js dev mode with HMR
  # --------------------------------------------------------------------------
  frontend:
    build:
      target: dev  # Dockerfile must have a dev stage
    command: npm run dev
    volumes:
      # Mount source code for hot-reload
      - ../../frontend:/app
      # Exclude node_modules from host (use container's installed deps)
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      # Enable React dev tools / fast refresh
      FAST_REFRESH: "true"

  # --------------------------------------------------------------------------
  # Gateway: hot-reload
  # --------------------------------------------------------------------------
  gateway:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ../../services/gateway/app:/app/app:ro
    environment:
      LOG_LEVEL: DEBUG

  # --------------------------------------------------------------------------
  # Orchestrator: hot-reload
  # --------------------------------------------------------------------------
  orchestrator:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
    volumes:
      - ../../services/orchestrator/app:/app/app:ro
    environment:
      LOG_LEVEL: DEBUG

  # --------------------------------------------------------------------------
  # Collector: hot-reload
  # --------------------------------------------------------------------------
  collector:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8002
    volumes:
      - ../../services/collector/app:/app/app:ro
    environment:
      LOG_LEVEL: DEBUG

  # --------------------------------------------------------------------------
  # Processor: hot-reload
  # --------------------------------------------------------------------------
  processor:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8003
    volumes:
      - ../../services/processor/app:/app/app:ro
    environment:
      LOG_LEVEL: DEBUG

  # --------------------------------------------------------------------------
  # LLM: hot-reload
  # --------------------------------------------------------------------------
  llm:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8004
    volumes:
      - ../../services/llm/app:/app/app:ro
    environment:
      LOG_LEVEL: DEBUG

  # --------------------------------------------------------------------------
  # Reports: hot-reload
  # --------------------------------------------------------------------------
  reports:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8005
    volumes:
      - ../../services/reports/app:/app/app:ro
    environment:
      LOG_LEVEL: DEBUG

  # --------------------------------------------------------------------------
  # Scenario: hot-reload
  # --------------------------------------------------------------------------
  scenario:
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8006
    volumes:
      - ../../services/scenario/app:/app/app:ro
    environment:
      LOG_LEVEL: DEBUG
